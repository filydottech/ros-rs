[package]
name = "ros-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A RouterOS native API client over TCP and TLS"
license = "MIT"
repository = "https://github.com/filydottech/ros-rs"
keywords = ["routeros", "mikrotik", "api", "client"]
categories = ["network-programming"]
readme = "README.md"

[dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "sync", "time", "io-util"] }
rustls = { version = "0.23", default-features = false, optional = true, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true, features = ["logging", "ring", "tls12"] }
socket2 = "0.6"

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pemfile", "dep:tokio-rustls"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
# `all` exposes the keepalive getters the socket tests read back.
socket2 = { version = "0.6", features = ["all"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
